[project]
name = "tecnostock-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Walter", email = "73874410@continental.edu.pe" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.16.2",
    "pyodbc>=5.3.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
tecnostock-backend = "tecnostock_backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
